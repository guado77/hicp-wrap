name: aggiorna e pubblica

on:
  schedule:
    # feriali, dopo le uscite del mattino (INSEE, INE, Istat, Eurostat) e del pomeriggio (Destatis)
    - cron: "30 10 * * 1-5"
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      commento:
        description: "Commento con Opus"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scarica dalle fonti
        env:
          DESTATIS_TOKEN: ${{ secrets.DESTATIS_TOKEN }}
          DESTATIS_USER: ${{ secrets.DESTATIS_USER }}
          DESTATIS_PASS: ${{ secrets.DESTATIS_PASS }}
        run: python aggiorna.py
      - name: Motore, PDF, Excel, invio
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PREVIEW_CHAT_ID: ${{ secrets.TELEGRAM_PREVIEW_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          OPZ=""
          if [ "${{ inputs.commento }}" = "false" ]; then OPZ="$OPZ --senza-commento"; fi
          # dall'orario si pubblica solo se c'e' un mese nuovo; dall'avvio manuale sempre
          if [ "${{ github.event_name }}" = "schedule" ]; then OPZ="$OPZ --solo-se-nuovo"; fi
          python main.py --invia $OPZ
      - name: Salva l'archivio aggiornato nel repo
        if: always()
        run: |
          git config user.name "hicp-wrap bot"
          git config user.email "actions@users.noreply.github.com"
          git add dati/storico
          git diff --cached --quiet || git commit -m "archivio aggiornato $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uscita
          path: |
            uscita/*.pdf
            uscita/*.xlsx
            uscita/pacchetto_dati.json
            dati/storico/log_fonti.txt
          retention-days: 30
