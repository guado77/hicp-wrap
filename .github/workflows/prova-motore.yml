name: prova motore (dati sintetici)

on:
  workflow_dispatch:

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Motore, Excel e PDF su dati sintetici
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PREVIEW_CHAT_ID: ${{ secrets.TELEGRAM_PREVIEW_CHAT_ID }}
        run: python main.py --esempio --senza-commento --invia --evento "prova del motore su dati sintetici"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prova-motore
          path: |
            uscita/*.pdf
            uscita/*.xlsx
            uscita/pacchetto_dati.json
          retention-days: 14
